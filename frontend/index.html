<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Расписание электричек — Прибывалка">
  <title>Прибывалка ⚡ Электрички</title>
  
  <!-- OpenLayers CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
  
  <!-- Основные стили -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Шапка сайта -->
  <header class="header" role="banner">
    <h1 class="header-title">🚄 Прибывалка</h1>
    <p class="header-subtitle">Расписание пригородных поездов</p>
  </header>

  <!-- Основной контент -->
  <main class="container" role="main">
    
    <!-- Поиск станции -->
    <section class="main-section search-section" aria-label="Поиск станции">
      <h2 class="section-title">🔍 Поиск станции</h2>
      
      <div class="search-group">
        <div class="input-with-icon">
          <input type="text" id="station-input" class="search-input" 
                placeholder="Название станции..." autocomplete="off">
          <button type="button" id="fav-add-btn" class="btn-fav-icon hidden" title="В избранное">
            <span class="fav-icon">☆</span>
          </button>
        </div>
        <button id="search-btn" class="btn btn-primary">Найти</button>
      </div>
      
      <button id="map-toggle-btn" class="btn btn-secondary" style="margin-top: 0.75rem; width: 100%;">
        🗺️ Показать на карте
      </button>
      
      <div id="search-results" class="search-results hidden"></div>
      <div id="directions-container" class="directions-container hidden"></div>
    </section>

    <!-- Маршруты -->
    <section class="main-section route-section" aria-label="Маршруты">
      <h2 class="section-title">🔎 Маршруты</h2>
      
      <div class="route-group">
        <div class="input-wrapper">
          <label for="from-input" class="input-label">Откуда</label>
          <div class="input-with-icon">
            <input type="text" id="from-input" class="route-input" 
                   placeholder="Станция отправления" autocomplete="off">
            <button type="button" id="fav-from-btn" class="btn-fav-icon hidden" title="В избранное">
              <span class="fav-icon">☆</span>
            </button>
          </div>
          <div id="from-results" class="search-results hidden"></div>
        </div>
        <div class="input-wrapper">
          <label for="to-input" class="input-label">Куда</label>
          <div class="input-with-icon">
            <input type="text" id="to-input" class="route-input" 
                   placeholder="Станция назначения" autocomplete="off">
            <button type="button" id="fav-to-btn" class="btn-fav-icon hidden" title="В избранное">
              <span class="fav-icon">☆</span>
            </button>
          </div>
          <div id="to-results" class="search-results hidden"></div>
        </div>
        <button id="route-btn" class="btn btn-primary">Найти маршрут</button>
      </div>
      
      <div id="route-results" class="route-results"></div>
    </section>

    <!-- Карта -->
    <section id="map-section" class="map-section hidden" aria-label="Карта">
      <div class="map-wrapper">
        <div id="map" class="map-container"></div>
        <button id="map-close-btn" class="btn btn-close" type="button" aria-label="Закрыть карту">✕</button>
      </div>
    </section>

    <!-- Избранное -->
    <aside class="favorites-panel" aria-label="Избранные станции">
      <h3 class="panel-title">⭐ Избранное</h3>
      <ul id="favorites-list" class="favorites-list"></ul>
    </aside>

  </main>

  <!-- Подвал сайта -->
  <footer class="footer">
    <p>Данные: <a href="https://yandex.ru/dev/rasp/" target="_blank" rel="noopener">Яндекс.Расписания</a></p>
  </footer>

  <!-- Библиотеки -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js" crossorigin="anonymous"></script>
  
  <!-- Модули приложения -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/api_client.js"></script>
  <script type="module" src="js/map.js"></script>
  <script type="module" src="js/search.js"></script>
  <script type="module" src="js/favorites.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
